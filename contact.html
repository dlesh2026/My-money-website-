<!DOCTYPE html>
<html>
<head>
    <title>Contact - My Money Website</title>

    <style>
        body {
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #4285f4;
        }

        input, textarea {
            width: 90%;
            max-width: 500px;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            background-color: green;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h1>Contact Us</h1>

<p>Have a question? Send us a message.</p>

<form>
    <input type="text" placeholder="Your Name">
    <br>

    <input type="email" placeholder="Your Email">
    <br>

    <textarea rows="5" placeholder="Your Message"></textarea>
    <br>

    <button type="submit">Send Message</button>
</form>

</body>
</html>
